name: Sketchpad static checks
on:
  push:
    branches: [feat/guofeng-sketchpad-release]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check app.js
      - name: Production package stays lightweight
        shell: bash
        run: |
          test $(wc -c < index.html) -lt 20000
          test $(wc -c < styles.css) -lt 40000
          test $(wc -c < app.js) -lt 100000
      - name: Sketchpad invariants
        shell: bash
        run: |
          grep -q 'id="committed-canvas"' index.html
          grep -q 'id="preview-canvas"' index.html
          grep -q '一指落笔' index.html
          grep -q 'WB2-' app.js
          grep -q '1440' app.js
          grep -q '2160' app.js
          grep -q 'requestAnimationFrame' app.js
          ! grep -q 'stage-canvas' index.html
          ! grep -Eq 'https?://[^ ]+\.(png|jpg|woff|ttf)' index.html styles.css app.js
