name: V2 mobile E2E

on:
  push:
    branches:
      - test/v2-mobile-e2e
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'qa/e2e.mjs'
      - '.github/workflows/v2-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium for CI only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/wsw-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8787/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wsw-http.log
          exit 1
      - name: Run Chromium E2E
        run: node qa/e2e.mjs
      - name: Upload screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-artifacts
          path: qa/e2e-artifacts
          if-no-files-found: warn
