<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#e9e0d2" />
  <meta name="description" content="纹生万象 · 国风随笔画：一张宣纸，一盒可以分享种子的国风画笔。" />
  <title>纹生万象 · 国风随笔画</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" aria-label="纹生万象">
      <span class="seal">纹</span>
      <span class="brand-copy"><strong>纹生万象</strong><small>国风随笔画</small></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="undo" type="button" aria-label="撤销" disabled>↶</button>
      <button class="icon-btn" id="redo" type="button" aria-label="重做" disabled>↷</button>
      <button class="export-btn" id="open-export" type="button">导出</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <div class="canvas-viewport" id="canvas-viewport" aria-label="绘画区域；一指绘画，两指缩放移动">
      <div class="paper-scene" id="paper-scene">
        <canvas id="committed-canvas" width="720" height="960"></canvas>
        <canvas id="preview-canvas" width="720" height="960" aria-label="画布"></canvas>
        <div class="paper-grain" aria-hidden="true"></div>
      </div>
      <div class="empty-hint" id="empty-hint">
        <strong>直接画吧</strong>
        <span>一指落笔 · 两指缩放移动</span>
      </div>
      <div class="canvas-status" id="canvas-status">3:4 · 高清画布</div>
      <button class="fit-btn" id="fit-view" type="button" aria-label="适应画布">适应</button>
      <div class="zoom-badge" id="zoom-badge">100%</div>
    </div>
  </main>

  <nav class="tool-dock" aria-label="绘画工具">
    <button class="tool active" id="open-brushes" type="button">
      <span class="brush-dot" id="brush-dot"></span><b>画笔</b><small id="brush-name">松烟墨</small>
    </button>
    <label class="tool color-tool" for="quick-color">
      <span class="color-dot" id="color-dot"></span><b>颜色</b><small id="color-label">墨色</small>
      <input id="quick-color" type="color" value="#2f2a27" aria-label="画笔颜色" />
    </label>
    <button class="tool" id="open-size" type="button"><span class="size-icon">━</span><b>粗细</b><small id="size-label">12</small></button>
    <button class="tool" id="eraser" type="button"><span>⌫</span><b>橡皮</b><small>按笔擦</small></button>
    <button class="tool" id="open-more" type="button"><span>•••</span><b>更多</b><small>画布</small></button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<aside class="bottom-sheet" id="bottom-sheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <header class="sheet-head">
    <div><small id="sheet-kicker">BRUSH</small><h2 id="sheet-title">画笔</h2></div>
    <button class="icon-btn" id="close-sheet" type="button" aria-label="关闭">×</button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<dialog id="info-dialog">
  <button class="dialog-close" id="close-info" type="button">×</button>
  <span class="big-seal">纹</span>
  <h2>纹生万象 · 国风随笔画</h2>
  <p>像普通画图软件一样随手画，但画笔来自水墨、飞白与传统纹样。每支画笔都可以压成一枚 <b>WB2 画笔种子</b>，复制给别人继续创作。</p>
  <ul>
    <li>一指绘画；两指缩放、移动画布。</li>
    <li>作品只在本机保存，分享时导出高清 PNG。</li>
    <li>画笔 Seed 只包含画笔配置，不包含你的作品。</li>
    <li>纯前端、零后端、零外部资源。</li>
  </ul>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
